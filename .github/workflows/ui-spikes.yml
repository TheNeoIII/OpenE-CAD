name: UI framework spikes

on:
  push:
    paths:
      - "ui-spikes/**"
      - ".github/workflows/ui-spikes.yml"
  pull_request:
    paths:
      - "ui-spikes/**"
      - ".github/workflows/ui-spikes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-egui:
    name: Check egui shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check egui shell
        run: cargo check --manifest-path ui-spikes/Cargo.toml -p opene-cad-ui-egui-spike

  check-iced:
    name: Check iced shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check iced shell
        run: cargo check --manifest-path ui-spikes/Cargo.toml -p opene-cad-ui-iced-spike

  check-slint:
    name: Check Slint shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Slint shell
        run: cargo check --manifest-path ui-spikes/Cargo.toml -p opene-cad-ui-slint-spike

  windows-egui-preview:
    name: Build Windows egui preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release egui shell
        run: cargo build --manifest-path ui-spikes/Cargo.toml -p opene-cad-ui-egui-spike --release
      - name: Upload egui preview
        uses: actions/upload-artifact@v7
        with:
          name: OpenE-CAD-S3-egui-shell-windows
          path: ui-spikes/target/release/opene-cad-ui-egui-spike.exe
          if-no-files-found: error
          retention-days: 14

  windows-iced-preview:
    name: Build Windows iced preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release iced shell
        run: cargo build --manifest-path ui-spikes/Cargo.toml -p opene-cad-ui-iced-spike --release
      - name: Upload iced preview
        uses: actions/upload-artifact@v7
        with:
          name: OpenE-CAD-S3-iced-shell-windows
          path: ui-spikes/target/release/opene-cad-ui-iced-spike.exe
          if-no-files-found: error
          retention-days: 14

  windows-slint-preview:
    name: Build Windows Slint preview
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release Slint shell
        run: cargo build --manifest-path ui-spikes/Cargo.toml -p opene-cad-ui-slint-spike --release
      - name: Upload Slint preview
        uses: actions/upload-artifact@v7
        with:
          name: OpenE-CAD-S3-slint-shell-windows
          path: ui-spikes/target/release/opene-cad-ui-slint-spike.exe
          if-no-files-found: error
          retention-days: 14
