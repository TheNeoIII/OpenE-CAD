name: UI framework spikes

on:
  push:
    paths:
      - "ui-spikes/**"
      - ".github/workflows/ui-spikes.yml"
  pull_request:
    paths:
      - "ui-spikes/**"
      - ".github/workflows/ui-spikes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-egui:
    name: Check egui shell (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check egui shell
        run: cargo check --manifest-path ui-spikes/Cargo.toml -p opene-cad-ui-egui-spike

  windows-preview:
    name: Build Windows egui preview
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release egui shell
        run: cargo build --manifest-path ui-spikes/Cargo.toml -p opene-cad-ui-egui-spike --release

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          name: OpenE-CAD-S3-egui-shell-windows
          path: ui-spikes/target/release/opene-cad-ui-egui-spike.exe
          if-no-files-found: error
          retention-days: 14
