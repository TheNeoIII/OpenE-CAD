name: Rust spike checks

on:
  push:
    paths:
      - "spikes/**"
      - ".github/workflows/spikes.yml"
  pull_request:
    paths:
      - "spikes/**"
      - ".github/workflows/spikes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-spikes:
    name: Check spikes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test S1 core geometry
        run: cargo test --manifest-path spikes/Cargo.toml -p opene-cad-core-geometry-spike

      - name: Check S2 CAD renderer
        run: cargo check --manifest-path spikes/Cargo.toml -p opene-cad-cad-renderer-spike
