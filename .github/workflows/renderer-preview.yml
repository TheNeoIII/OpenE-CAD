name: Renderer preview

on:
  push:
    paths:
      - "spikes/Cargo.toml"
      - "spikes/cad-primitives/**"
      - "spikes/cad-renderer/**"
      - "spikes/editor-interaction/**"
      - "spikes/text-lod/**"
      - "spikes/text-renderer/**"
      - ".github/workflows/renderer-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-preview:
    name: Build Windows S2 preview
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release renderer spikes
        run: |
          cargo build --manifest-path spikes/Cargo.toml -p opene-cad-cad-renderer-spike --release
          cargo build --manifest-path spikes/Cargo.toml -p opene-cad-text-renderer-spike --release

      - name: Upload renderer previews
        uses: actions/upload-artifact@v7
        with:
          name: OpenE-CAD-S2-renderer-windows
          path: |
            spikes/target/release/opene-cad-cad-renderer-spike.exe
            spikes/target/release/integrated_text.exe
            spikes/target/release/primitives_overlay.exe
            spikes/target/release/interaction_overlay_v2.exe
            spikes/target/release/opene-cad-text-renderer-spike.exe
          if-no-files-found: error
          retention-days: 14
