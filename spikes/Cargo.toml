[workspace]
resolver = "2"
members = [
    "core-geometry",
    "cad-renderer",
]

[workspace.package]
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/TheNeoIII/OpenE-CAD"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["serde", "v7"] }
bytemuck = { version = "1.24", features = ["derive"] }
env_logger = "0.11"
pollster = "0.4"
wgpu = "30.0.1"
winit = "0.30.13"
